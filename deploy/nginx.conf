# Same-origin reverse proxy for the Yi Chinese stack.
#   /api        -> Flask api container (full path preserved)
#   /socket.io  -> Flask api container, with WebSocket upgrade
#   everything  -> Next.js web container

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:8080; }

# Set the Connection header only when the client requested an upgrade.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Speaking-check uploads send browser audio; allow a generous body.
  client_max_body_size 25m;

  # ── Flask API ───────────────────────────────────────────────────────────
  location /api {
    proxy_pass http://api_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Socket.IO (Learn Together) ──────────────────────────────────────────
  location /socket.io {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ── Next.js frontend ────────────────────────────────────────────────────
  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
