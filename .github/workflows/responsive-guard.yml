# Runs the learner responsive overflow guard (Playwright) on PRs and on pushes
# to the working branches. See e2e/README.md and docs/responsive-conventions.md.
#
# Public learner routes are checked at 393 / 768 / 1280px with no backend. The
# authenticated routes self-skip unless a test learner is provided: set repo
# secrets E2E_USERNAME / E2E_PASSWORD and stand up the Flask backend on :5000
# (e.g. as a service job) to enable them — no code change needed.
name: Responsive guard

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [dev, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  responsive-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive overflow guard
        # Auth routes skip without E2E_USERNAME / E2E_PASSWORD (and a backend).
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
